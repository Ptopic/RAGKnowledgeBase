name: Build & Deploy to Coolify

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  FRONTEND_IMAGE: ghcr.io/ptopic/ragknowledgebase/frontend
  BACKEND_IMAGE: ghcr.io/ptopic/ragknowledgebase/backend
  COOLIFY_APP_NAME: rag-knowledge-base

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ─── Build & Push Backend ──────────────────────────────
      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:latest,${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ─── Build & Push Frontend ─────────────────────────────
      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:latest,${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_WEBSITE_URL=${{ secrets.NEXT_PUBLIC_WEBSITE_URL }}

      # ─── Resolve Coolify App UUID ────────────────────────────
      - name: Resolve Coolify app UUID
        id: coolify
        run: |
          APP_UUID=$(curl -s \
            "https://coolify.petartopic.com/api/v1/applications" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}" \
            | python3 -c "
          import sys, json
          apps = json.loads(sys.stdin.read())
          match = [a['uuid'] for a in apps if a.get('name') == '${{ env.COOLIFY_APP_NAME }}']
          if match:
              print(match[0])
          else:
              print(''); sys.exit(1)
          ")
          if [ -z "$APP_UUID" ]; then
            echo "❌ App '${{ env.COOLIFY_APP_NAME }}' not found in Coolify"
            exit 1
          fi
          echo "uuid=$APP_UUID" >> "$GITHUB_OUTPUT"
          echo "✅ Resolved Coolify app UUID: $APP_UUID"

      # ─── Trigger Coolify Deploy ────────────────────────────
      - name: Trigger Coolify deployment
        run: |
          curl -X POST \
            "https://coolify.petartopic.com/api/v1/deploy" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"uuid": "${{ steps.coolify.outputs.uuid }}"}' \
            --fail --silent --show-error
