name: Build & Deploy to Coolify (manual ref)

on:
  workflow_dispatch:

run-name: "Manual deploy: ${{ github.ref_name }}"

concurrency:
  group: coolify-prod-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  FRONTEND_IMAGE: ghcr.io/ptopic/ragknowledgebase/frontend
  BACKEND_IMAGE: ghcr.io/ptopic/ragknowledgebase/backend
  COOLIFY_BACKEND_APP_NAME: rag-knowledge-base
  COOLIFY_FRONTEND_APP_NAME: rag-knowledge-base-frontend

jobs:
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout selected branch/ref
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push backend (latest)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout selected branch/ref
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push frontend (latest)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    steps:
      - name: Resolve Coolify app UUIDs by name
        id: coolify
        run: |
          APPS_JSON=$(curl -s \
            "https://coolify.petartopic.com/api/v1/applications" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}")

          BACKEND_UUID=$(echo "$APPS_JSON" | jq -r '.[] | select(.name=="${{ env.COOLIFY_BACKEND_APP_NAME }}") | .uuid' | head -n1)
          FRONTEND_UUID=$(echo "$APPS_JSON" | jq -r '.[] | select(.name=="${{ env.COOLIFY_FRONTEND_APP_NAME }}") | .uuid' | head -n1)

          if [ -z "$BACKEND_UUID" ] || [ -z "$FRONTEND_UUID" ]; then
            echo "Could not resolve Coolify app UUIDs. backend='$BACKEND_UUID' frontend='$FRONTEND_UUID'"
            exit 1
          fi

          echo "backend_uuid=$BACKEND_UUID" >> "$GITHUB_OUTPUT"
          echo "frontend_uuid=$FRONTEND_UUID" >> "$GITHUB_OUTPUT"

      - name: Trigger Coolify backend deployment
        run: |
          curl -X POST \
            "https://coolify.petartopic.com/api/v1/deploy" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"uuid": "${{ steps.coolify.outputs.backend_uuid }}"}' \
            --fail --silent --show-error

      - name: Trigger Coolify frontend deployment
        run: |
          curl -X POST \
            "https://coolify.petartopic.com/api/v1/deploy" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"uuid": "${{ steps.coolify.outputs.frontend_uuid }}"}' \
            --fail --silent --show-error

      - name: Wait for frontend to be healthy
        run: |
          echo "Waiting for frontend deployment to complete..."
          MAX_WAIT=120
          ELAPSED=0
          while [ $ELAPSED -lt $MAX_WAIT ]; do
            if curl -sf -o /dev/null "https://rag.petartopic.com/"; then
              echo "Frontend is healthy after ${ELAPSED}s"
              break
            fi
            echo "Frontend not ready yet (${ELAPSED}s/${MAX_WAIT}s)..."
            sleep 5
            ELAPSED=$((ELAPSED + 5))
          done

          if [ $ELAPSED -ge $MAX_WAIT ]; then
            echo "::warning::Frontend did not become healthy within ${MAX_WAIT}s, but deployment was triggered"
          fi
