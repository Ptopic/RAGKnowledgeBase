# ─── RAGKnowledgeBase — Coolify Docker Compose ─────────────────
# Services: PostgreSQL (pgvector) + Redis + Backend (NestJS) + Frontend (Next.js)
#
# Backend and Frontend images are pre-built by GitHub Actions and pushed
# to ghcr.io. Coolify just pulls and runs them — no on-server building.
#
# ALL runtime env vars are injected by Coolify at container startup.
# No ${VAR} interpolation in this file — Coolify will NOT rewrite Dockerfiles.
#
# Required Coolify env vars (set in App → Environment):
#   DATABASE_URL, REDIS_URL, JWT_SECRET, OPENAI_API_KEY, etc.
#   (see .env.example for full list)
#
# Build-time vars (NEXT_PUBLIC_*) are baked into the frontend image
# by GitHub Actions via build-args — never appear here.

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rag_knowledge_base
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-pgvector.sql:/docker-entrypoint-initdb.d/01-enable-pgvector.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rag_knowledge_base"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/ptopic/ragknowledgebase/backend:latest
    pull_policy: always
    restart: unless-stopped
    environment:
      PORT: 3002
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.rag-backend.rule=Host(`rag-api.petartopic.com`)
      - traefik.http.routers.rag-backend.entrypoints=http,https
      - traefik.http.routers.rag-backend.tls=true
      - traefik.http.routers.rag-backend.tls.certresolver=letsencrypt
      - traefik.http.services.rag-backend.loadbalancer.server.port=3002
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3002/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s

volumes:
  postgres_data:
  redis_data:
