# ─── RAGKnowledgeBase — Coolify Docker Compose ─────────────────
# Services: PostgreSQL (pgvector) + Redis + Backend (NestJS) + Frontend (Next.js)
# All services communicate over the internal Docker network.
# DATABASE_URL and REDIS_HOST use internal service names (not localhost).
#
# NOTE: No ${VAR} interpolation here — Coolify injects env vars at runtime
# via --env-file. Using ${VAR} causes Coolify to inject 100+ ARG declarations
# into each Dockerfile, breaking multi-stage builds.

services:
  # ─── PostgreSQL with pgvector ──────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag-kb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rag_knowledge_base
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: changeme
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-pgvector.sql:/docker-entrypoint-initdb.d/01-enable-pgvector.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rag_knowledge_base"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ─── Redis ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: rag-kb-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Backend (NestJS + Prisma + BullMQ) ───────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rag-kb-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 3002
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3002/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─── Frontend (Next.js standalone) ─────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rag-kb-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      PORT: 3000
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
  redis_data:
