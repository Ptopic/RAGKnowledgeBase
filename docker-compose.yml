# ─── RAGKnowledgeBase — Coolify Docker Compose ─────────────────
# Services: PostgreSQL (pgvector) + Redis + Backend (NestJS) + Frontend (Next.js)
#
# IMPORTANT: No ${VAR} interpolation! Coolify auto-injects env vars set in the
# Coolify UI at container runtime. Using ${VAR} causes Coolify to inject them
# as ARG declarations into Dockerfiles, breaking multi-stage builds.
# All env vars are set directly in the Coolify application environment.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag-kb-postgres
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-pgvector.sql:/docker-entrypoint-initdb.d/01-enable-pgvector.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rag_knowledge_base"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: rag-kb-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rag-kb-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3002/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rag-kb-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
  redis_data:
