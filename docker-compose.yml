# ─── RAGKnowledgeBase — Coolify Docker Compose ─────────────────
# Services: PostgreSQL (pgvector) + Redis + Backend (NestJS) + Frontend (Next.js)
#
# Backend and Frontend images are pre-built by GitHub Actions and pushed
# to ghcr.io. Coolify just pulls and runs them — no on-server building.
#
# ALL runtime env vars are injected by Coolify at container startup.
# No ${VAR} interpolation in this file — Coolify will NOT rewrite Dockerfiles.
#
# Required Coolify env vars (set in App → Environment):
#   DATABASE_URL, REDIS_URL, JWT_SECRET, OPENAI_API_KEY, etc.
#   (see .env.example for full list)
#
# Build-time vars (NEXT_PUBLIC_*) are baked into the frontend image
# by GitHub Actions via build-args — never appear here.

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-pgvector.sql:/docker-entrypoint-initdb.d/01-enable-pgvector.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rag_knowledge_base"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/ptopic/ragknowledgebase/backend:latest
    pull_policy: always
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3002/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s

  frontend:
    image: ghcr.io/ptopic/ragknowledgebase/frontend:latest
    pull_policy: always
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

volumes:
  postgres_data:
  redis_data:
