# ─── RAGKnowledgeBase — Coolify Docker Compose ─────────────────
# Services: PostgreSQL (pgvector) + Redis + Backend (NestJS) + Frontend (Next.js)
# All services communicate over the internal Docker network.
# DATABASE_URL and REDIS_HOST use internal service names (not localhost).

services:
  # ─── PostgreSQL with pgvector ──────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag-kb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rag_knowledge_base}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-pgvector.sql:/docker-entrypoint-initdb.d/01-enable-pgvector.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-rag_knowledge_base}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ─── Redis ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: rag-kb-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Backend (NestJS + Prisma + BullMQ) ───────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rag-kb-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3002

      # ─── Database (internal Docker hostname, NOT localhost) ───
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-rag_knowledge_base}?schema=public

      # ─── Redis (internal Docker hostname) ────────────────────
      REDIS_HOST: redis
      REDIS_PORT: 6379

      # ─── URLs ────────────────────────────────────────────────
      NEXT_FRONTEND_URL: ${NEXT_FRONTEND_URL:-http://localhost:3000}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:3002}

      # ─── Auth (REQUIRED) ─────────────────────────────────────
      AUTH_TYPE: ${AUTH_TYPE:-email}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-TRUE}

      # ─── Email / Resend ─────────────────────────────────────
      RESEND_API_KEY: ${RESEND_API_KEY:-}

      # ─── Google OAuth ───────────────────────────────────────
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_CALENDAR_REDIRECT_URI: ${GOOGLE_CALENDAR_REDIRECT_URI:-}
      GOOGLE_GMAIL_REDIRECT_URI: ${GOOGLE_GMAIL_REDIRECT_URI:-}

      # ─── Encryption ──────────────────────────────────────────
      API_ENCRYPTION_KEY: ${API_ENCRYPTION_KEY:?Set API_ENCRYPTION_KEY}

      # ─── Embedding / RAG ─────────────────────────────────────
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      EMBEDDING_MAX_SEQ_LENGTH: ${EMBEDDING_MAX_SEQ_LENGTH:-512}
      CHUNK_SIZE: ${CHUNK_SIZE:-512}
      CHUNK_STRATEGY: ${CHUNK_STRATEGY:-markdown_aware}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-120}
      CHUNK_MIN_CHARS: ${CHUNK_MIN_CHARS:-40}

      # ─── Image Analysis ──────────────────────────────────────
      IMAGE_ENABLE_ANALYSIS: ${IMAGE_ENABLE_ANALYSIS:-true}
      IMAGE_VISION_MODEL: ${IMAGE_VISION_MODEL:-google/gemini-3-flash-preview}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}

      # ─── Reranker ────────────────────────────────────────────
      RERANKER_ENABLED: ${RERANKER_ENABLED:-TRUE}
      RERANKER_NAME: ${RERANKER_NAME:-jina-reranker-v1-base-en}
      RERANKER_TYPE: ${RERANKER_TYPE:-jina}
      RERANKER_API_KEY: ${RERANKER_API_KEY:-}

      # ─── ETL ────────────────────────────────────────────────
      ETL_SERVICE: ${ETL_SERVICE:-DOCLING}
      DOCLING_API_URL: ${DOCLING_API_URL:-http://localhost:5000}

      # ─── Jina Reader ────────────────────────────────────────
      JINA_READER_ENABLED: ${JINA_READER_ENABLED:-TRUE}
      JINA_READER_API_KEY: ${JINA_READER_API_KEY:-}

      # ─── Connector API Keys ──────────────────────────────────
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      SLACK_TOKEN: ${SLACK_TOKEN:-}
      NOTION_TOKEN: ${NOTION_TOKEN:-}

      # ─── LLM Provider Keys ──────────────────────────────────
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}

      # ─── S3 / Storage ────────────────────────────────────────
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-}
      S3_PUBLIC_URL_PREFIX: ${S3_PUBLIC_URL_PREFIX:-}

      # ─── Observability ──────────────────────────────────────
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGCHAIN_TRACING_V2: ${LANGCHAIN_TRACING_V2:-FALSE}

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3002/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─── Frontend (Next.js standalone) ─────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3002}
        NEXT_PUBLIC_WEBSITE_URL: ${NEXT_PUBLIC_WEBSITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-RAG Knowledge Base}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    container_name: rag-kb-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3002}
      NEXT_PUBLIC_WEBSITE_URL: ${NEXT_PUBLIC_WEBSITE_URL:-http://localhost:3000}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
  redis_data:
