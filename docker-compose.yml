# ─── RAGKnowledgeBase — Coolify Docker Compose ─────────────────
# Services: PostgreSQL (pgvector) + Redis + Backend (NestJS) + Frontend (Next.js)
# Only secrets and NEXT_PUBLIC_* vars use ${VAR} interpolation (Coolify env vars).
# All other config is hardcoded to minimize Coolify ARG injection into Dockerfiles.

services:
  # ─── PostgreSQL with pgvector ──────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag-kb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rag_knowledge_base
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD}'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-pgvector.sql:/docker-entrypoint-initdb.d/01-enable-pgvector.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rag_knowledge_base"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ─── Redis ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: rag-kb-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Backend (NestJS + Prisma + BullMQ) ───────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rag-kb-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3002
      DATABASE_URL: 'postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/rag_knowledge_base?schema=public'
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NEXT_FRONTEND_URL: 'https://rag.petartopic.com'
      BACKEND_URL: 'https://rag-api.petartopic.com'
      AUTH_TYPE: email
      SECRET_KEY: '${SECRET_KEY}'
      JWT_SECRET: '${JWT_SECRET}'
      API_ENCRYPTION_KEY: '${API_ENCRYPTION_KEY}'
      REGISTRATION_ENABLED: TRUE
      EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
      EMBEDDING_MAX_SEQ_LENGTH: 512
      CHUNK_SIZE: 512
      CHUNK_STRATEGY: markdown_aware
      CHUNK_OVERLAP: 120
      CHUNK_MIN_CHARS: 40
      IMAGE_ENABLE_ANALYSIS: true
      IMAGE_VISION_MODEL: google/gemini-3-flash-preview
      RERANKER_ENABLED: TRUE
      RERANKER_NAME: jina-reranker-v1-base-en
      RERANKER_TYPE: jina
      JINA_READER_ENABLED: TRUE
      ETL_SERVICE: DOCLING
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3002/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─── Frontend (Next.js standalone) ─────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rag-kb-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: '${NEXT_PUBLIC_API_URL}'
      NEXT_PUBLIC_WEBSITE_URL: '${NEXT_PUBLIC_WEBSITE_URL}'
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
  redis_data:
